<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
<title id="t">A rebalance</title>
<desc id="d">The stock that is above its target is sold for USDG. The USDG buys the stock that is below its target. Afterwards every stock is back in its band. The shares and the holders are not touched.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#06110f"/><stop offset="1" stop-color="#0c2a2a"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fcfcfc"/></marker>
</defs>
<rect width="760" height="330" rx="10" fill="url(#bg)"/>
<g fill="none" stroke-width="2">
<rect x="30" y="50" width="170" height="80" stroke="#f83800"/>
<rect x="295" y="50" width="170" height="80" stroke="#fcbc3c"/>
<rect x="560" y="50" width="170" height="80" stroke="#00e800"/>
<rect x="30" y="200" width="700" height="60" stroke="#3cbcfc"/>
<path d="M200 90H295" stroke="#fcfcfc" marker-end="url(#ar)"/>
<path d="M465 90H560" stroke="#fcfcfc" marker-end="url(#ar)"/>
</g>
<g fill="#fcfcfc" text-anchor="middle">
<text x="115" y="84" fill="#f83800" font-weight="bold">ABOVE TARGET</text><text x="115" y="106">sold</text>
<text x="380" y="84" fill="#fcbc3c" font-weight="bold">USDG</text><text x="380" y="106">through the pools</text>
<text x="645" y="84" fill="#00e800" font-weight="bold">BELOW TARGET</text><text x="645" y="106">bought</text>
<text x="380" y="36" fill="#3cbcfc" font-weight="bold">sells first, then buys</text>
<text x="380" y="226" fill="#3cbcfc" font-weight="bold">EVERY STOCK BACK INSIDE ITS BAND</text>
<text x="380" y="246">the targets and your shares do not change</text>
<text x="380" y="292" fill="#7c7c7c" font-size="12">each trade is checked against the pool's recent average price; one that would give up too much is refused</text>
<text x="380" y="312" fill="#7c7c7c" font-size="12">anyone can press REBALANCE once the minimum interval has passed</text>
</g>
</svg>
